version: "3.9"

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mqtt-broker
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    networks:
      - sensor-network
    command: >
      sh -c "mkdir -p /mosquitto/config &&
             echo 'listener 1883' > /mosquitto/config/mosquitto.conf &&
             echo 'allow_anonymous true' >> /mosquitto/config/mosquitto.conf &&
             echo 'listener 9001' >> /mosquitto/config/mosquitto.conf &&
             echo 'protocol websockets' >> /mosquitto/config/mosquitto.conf &&
             mosquitto -c /mosquitto/config/mosquitto.conf"

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: adminpassword123
      DOCKER_INFLUXDB_INIT_ORG: sensorgateway
      DOCKER_INFLUXDB_INIT_BUCKET: sensor_data
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: my-super-secret-auth-token
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    networks:
      - sensor-network

  nodered:
    build: ./nodered
    container_name: node-red
    restart: unless-stopped
    ports:
      - "1880:1880"
    environment:
      - TZ=Europe/Brussels
    volumes:
      - nodered-data:/data
      - ./nodered/flows.json:/data/flows.json
    depends_on:
      - mosquitto
      - influxdb
    networks:
      - sensor-network

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    command: --admin-password='$$2y$$05$$ZXCo5KTON6rVke.UN4AaTuA4obn0jPFDpbdqcEcFTgjCD6OYwwrna'
    networks:
      - sensor-network

  sensor-simulator:
    image: python:3.11-slim
    container_name: sensor-simulator
    restart: unless-stopped
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      PUBLISH_INTERVAL: "2"
    depends_on:
      - mosquitto
    networks:
      - sensor-network
    working_dir: /app
    volumes:
      - ./simulator:/app
    command: >
      /bin/bash -c "pip install -q 'paho-mqtt<2.0.0' && python3 sensor_simulator.py"

volumes:
  mosquitto-data:
  mosquitto-log:
  influxdb-data:
  influxdb-config:
  nodered-data:
  portainer-data:

networks:
  sensor-network:
    driver: bridge
