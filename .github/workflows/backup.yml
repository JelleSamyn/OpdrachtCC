name: Project Backup

on:
  schedule:
    - cron: "0 2 */2 * *"   # Elke 2 dagen om 02:00 UTC
  workflow_dispatch:

# 🔑 NODIG om te kunnen pushen
permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Repository checkout
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 2️⃣ Python installeren
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # 3️⃣ Backups map aanmaken
      - name: Create backup directory
        run: mkdir -p backups

      # 4️⃣ Backup script uitvoeren
      - name: Run backup script
        run: python backup.py

      # 5️⃣ Commit & push naar backups branch
      - name: Commit and push backup
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Automated backup"
          branch: backups
          create_branch: true
          file_pattern: backups/*
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
