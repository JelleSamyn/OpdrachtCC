version: "3.8"

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: sg_mosquitto
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    ports:
      - "1883:1883"
    networks:
      - sg-net

  influxdb:
    image: influxdb:2.7
    container_name: sg_influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: sg_admin
      DOCKER_INFLUXDB_INIT_PASSWORD: sg_password
      DOCKER_INFLUXDB_INIT_ORG: sg_org
      DOCKER_INFLUXDB_INIT_BUCKET: sg_bucket
      DOCKER_INFLUXDB_INIT_RETENTION: 0
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: sg_default_token_please_change
    volumes:
      - influxdb_data:/var/lib/influxdb2
    ports:
      - "8086:8086"
    networks:
      - sg-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  dashboard-importer:
    image: curlimages/curl:latest
    container_name: sg_dashboard_importer
    depends_on:
      influxdb:
        condition: service_healthy
    volumes:
      - ./influx/sensor_gateway.json:/tmp/sensor_gateway.json:ro
      - ./scripts/import-dashboard.sh:/tmp/import-dashboard.sh:ro
    entrypoint: ["/bin/sh", "/tmp/import-dashboard.sh"]
    environment:
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: sg_default_token_please_change
      INFLUX_ORG: sg_org
    networks:
      - sg-net

  nodered:
    build:
      context: ./nodered
      dockerfile: Dockerfile
    container_name: sg_nodered
    command: >
      --mqtt-broker mqtt://sg_mosquitto:1883
      --influx-url http://sg_influxdb:8086
      --influx-org sg_org
      --influx-bucket sg_bucket
      --influx-token sg_default_token_please_change
    volumes:
      - nodered_data:/data
      - ./nodered/flows.json:/data/flows.json
    ports:
      - "1880:1880"
    depends_on:
      - mosquitto
      - influxdb
    networks:
      - sg-net

  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: sg_simulator
    depends_on:
      - mosquitto
    networks:
      - sg-net

  portainer:
    image: portainer/portainer-ce:latest
    container_name: sg_portainer
    command: -H unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - "9000:9000"
    networks:
      - sg-net

  watchtower:
    image: containrrr/watchtower:latest
    container_name: sg_watchtower
    restart: "no"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --schedule "0 0 * * *" --cleanup
    networks:
      - sg-net

volumes:
  mosquitto_data:
  mosquitto_log:
  influxdb_data:
  nodered_data:
  portainer_data:

networks:
  sg-net:
    driver: bridge
