name: Project Backup

# Run automatisch elke 2 dagen
on:
  schedule:
    - cron: '0 2 */2 * *'  # Elke 2 dagen om 02:00 UTC
  workflow_dispatch:       # Maakt handmatige trigger mogelijk

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout de repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Setup Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 3️⃣ Run backup script
      - name: Run backup script
        run: python backup.py

      # 4️⃣ Commit & push de zip naar repo
      - name: Commit and push backup
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Automated backup ${{ github.event.schedule }}"
          branch: main
          file_pattern: backups/*
